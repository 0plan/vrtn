server {
    listen       80;
    listen  [::]:80;

    root /usr/share/nginx/html;
    location / {
        rewrite ^(.+)/$ $1 last;
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
